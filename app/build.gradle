def releaseInput = { String name ->
    providers.environmentVariable(name).orElse(providers.gradleProperty(name))
}

def releaseVersionCodeText = releaseInput("BIKE_COMPANION_VERSION_CODE").get()
def releaseVersionCode
try {
    releaseVersionCode = releaseVersionCodeText.toInteger()
} catch (NumberFormatException ignored) {
    throw new GradleException("BIKE_COMPANION_VERSION_CODE must be a positive integer")
}
if (releaseVersionCode < 1) {
    throw new GradleException("BIKE_COMPANION_VERSION_CODE must be a positive integer")
}

def releaseVersionName = releaseInput("BIKE_COMPANION_VERSION_NAME").get().trim()
if (releaseVersionName.isEmpty()) {
    throw new GradleException("BIKE_COMPANION_VERSION_NAME must not be empty")
}

def uploadSigningInputs = [
    BIKE_COMPANION_UPLOAD_STORE_FILE: releaseInput("BIKE_COMPANION_UPLOAD_STORE_FILE"),
    BIKE_COMPANION_UPLOAD_STORE_PASSWORD: releaseInput("BIKE_COMPANION_UPLOAD_STORE_PASSWORD"),
    BIKE_COMPANION_UPLOAD_KEY_ALIAS: releaseInput("BIKE_COMPANION_UPLOAD_KEY_ALIAS"),
    BIKE_COMPANION_UPLOAD_KEY_PASSWORD: releaseInput("BIKE_COMPANION_UPLOAD_KEY_PASSWORD"),
]
def missingUploadSigningInputs = uploadSigningInputs.findAll { name, value ->
    !value.isPresent() || value.get().trim().isEmpty()
}.keySet()
def hasUploadSigningInputs = missingUploadSigningInputs.isEmpty()

android {
    namespace = "com.clintoncochrane.bikecompanion"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.clintoncochrane.bikecompanion"
        minSdk = 26
        targetSdk = 36
        versionCode = releaseVersionCode
        versionName = releaseVersionName
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasUploadSigningInputs) {
                storeFile = file(uploadSigningInputs.BIKE_COMPANION_UPLOAD_STORE_FILE.get())
                storePassword = uploadSigningInputs.BIKE_COMPANION_UPLOAD_STORE_PASSWORD.get()
                keyAlias = uploadSigningInputs.BIKE_COMPANION_UPLOAD_KEY_ALIAS.get()
                keyPassword = uploadSigningInputs.BIKE_COMPANION_UPLOAD_KEY_PASSWORD.get()
            }
        }
    }

    buildTypes {
        release {
            if (hasUploadSigningInputs) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = false
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += [
        "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
        "-opt-in=androidx.compose.foundation.layout.ExperimentalLayoutApi",
    ]
    }
    buildFeatures {
        compose = true
    }
    sourceSets {
        androidTest.assets.srcDir("$projectDir/schemas")
    }
}

def validateReleaseSigning = tasks.register("validateReleaseSigning") {
    group = "verification"
    description = "Validates the external Play upload signing configuration."

    doLast {
        if (!missingUploadSigningInputs.isEmpty()) {
            throw new GradleException(
                "Missing release signing inputs: ${missingUploadSigningInputs.join(', ')}. " +
                    "Set them as environment variables or user-level Gradle properties."
            )
        }

        def uploadStore = file(uploadSigningInputs.BIKE_COMPANION_UPLOAD_STORE_FILE.get())
        if (!uploadStore.isFile()) {
            throw new GradleException("Upload keystore does not exist: ${uploadStore}")
        }
    }
}

tasks.configureEach {
    if (name == "preReleaseBuild") {
        dependsOn(validateReleaseSigning)
    }
}

