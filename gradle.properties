# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Kotlin Gradle Plugin 2.0.20 is affected by GHSA-r937-wjx7-w2jp. Keep build-cache
# metadata disabled until the Hilt/Room toolchain can move to a patched Kotlin release.
org.gradle.caching=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Public release version defaults. Increase the code for every Play upload and set the
# user-facing name intentionally. CI may override either value with an environment variable.
BIKE_COMPANION_VERSION_CODE=1
BIKE_COMPANION_VERSION_NAME=2.0.0
